[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "networkfox"
dynamic = ["version"]
description = "Lightweight computation graphs for Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Seshu Yamajala" },
    { name = "Huy Nguyen" },
    { name = "Arel Cordero" },
    { name = "Pierre Garrigues" },
    { name = "Rob Hess" },
    { name = "Tobi Baumgartner" },
    { name = "Clayton Mellina" },
]
requires-python = ">=3.9"
dependencies = ["networkx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

[project.optional-dependencies]
plot = ["pydot", "matplotlib"]

[project.urls]
Homepage = "https://github.com/slac-lcls/networkfox"

[tool.setuptools.dynamic]
version = {attr = "networkfox.__version__"}
